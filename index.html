    <title>Loriano Librado Jr. — Full-stack Developer &amp; IT Support</title>
    <script>
      // Plan 5: resolve and apply the theme before first paint. Running this in
      // head as a blocking script is what stops the flash; React picking the
      // theme up afterwards is too late to matter visually.
      ;(function () {
        var meta = document.querySelector('meta[name="theme-color"]')
        var resolved = "dark"
        try {
          var stored = localStorage.getItem("theme")
          if (stored === "light" || stored === "dark") {
            resolved = stored
          } else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
            resolved = "light"
          }
        } catch (error) {
          // Private mode or storage blocked: fall through to the dark default.
        }
        document.documentElement.classList.toggle("dark", resolved === "dark")
        // Plan 8: the section reveal's hidden state is scoped to this
        // attribute, so sections are only ever hidden when JS is running and
        // able to un-hide them. Set here, before first paint, so the reveal
        // never has to hide-then-show on mount.
        document.documentElement.dataset.js = "true"
        if (meta) {
          meta.setAttribute("content", resolved === "dark" ? "#050505" : "#f3f2ee")
        }
      })()
    </script>
  </head>
  <body>
